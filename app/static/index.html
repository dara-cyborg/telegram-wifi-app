<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Internet Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-neutral-50 font-sans text-neutral-900">
  <main class="mx-auto max-w-2xl px-4 pb-8">
    <header class="sticky top-0 z-10 -mx-4 mb-4 border-b border-neutral-200 bg-neutral-50 px-4 py-3">
      <div class="flex items-center justify-between gap-3">
        <div><h1 class="font-semibold">Internet Tracker</h1><p id="today" class="font-mono text-xs text-neutral-500"></p></div>
        <div class="flex gap-2"><button id="btn-report" class="rounded border border-neutral-300 bg-white px-2.5 py-1.5 text-xs hover:bg-neutral-100">Report</button><button id="btn-add-room" class="rounded bg-neutral-900 px-3 py-1.5 text-xs font-medium text-white hover:bg-neutral-800">+ Add Room</button></div>
      </div>
    </header>
    <div id="message" class="mb-3 hidden border px-3 py-2 text-sm"></div>
    <section class="mb-4 space-y-2">
      <input id="search" type="search" placeholder="Search room, SSID, or MAC..." class="w-full rounded border border-neutral-300 bg-white px-3 py-2 text-sm focus:border-neutral-900 focus:outline-none">
      <div id="filters" class="flex flex-wrap gap-2"></div>
    </section>
    <section id="tenants" class="space-y-3"></section>
  </main>

  <div id="room-modal" class="fixed inset-0 z-20 hidden items-center justify-center bg-black/40 p-4">
    <div class="max-h-[90vh] w-full max-w-md overflow-y-auto rounded border border-neutral-300 bg-white p-4">
      <div class="mb-4 flex items-center justify-between"><h2 id="room-modal-title" class="font-semibold">Add Room</h2><button data-close="room-modal" class="text-xl text-neutral-500">×</button></div>
      <form id="room-form" class="space-y-3">
        <label class="block text-xs font-medium text-neutral-700">Room Number<input id="room-number" required class="mt-1 w-full rounded border border-neutral-300 px-3 py-2 text-sm"></label>
        <label class="block text-xs font-medium text-neutral-700">SSID<input id="ssid" required class="mt-1 w-full rounded border border-neutral-300 px-3 py-2 text-sm"></label>
        <label class="block text-xs font-medium text-neutral-700">Due Day<input id="due-day" type="number" min="1" max="31" required class="mt-1 w-full rounded border border-neutral-300 px-3 py-2 text-sm"></label>
        <label class="block text-xs font-medium text-neutral-700">Last Payment Date<input id="last-payment-date" type="date" required class="mt-1 w-full rounded border border-neutral-300 px-3 py-2 text-sm"></label>
        <div><label class="block text-xs font-medium text-neutral-700">MAC Addresses</label><div id="mac-inputs-container" class="mt-1 space-y-2"></div><button id="btn-add-mac" type="button" class="mt-2 text-xs text-neutral-700 underline">+ Add MAC Address</button></div>
        <div class="flex justify-end gap-2 border-t border-neutral-100 pt-3"><button type="button" data-close="room-modal" class="rounded border border-neutral-300 px-3 py-1.5 text-sm">Cancel</button><button class="rounded bg-neutral-900 px-3 py-1.5 text-sm text-white">Save Room</button></div>
      </form>
    </div>
  </div>

  <div id="pay-modal" class="fixed inset-0 z-20 hidden items-center justify-center bg-black/40 p-4">
    <div class="w-full max-w-sm rounded border border-neutral-300 bg-white p-4">
      <h2 id="pay-modal-title" class="font-semibold">Record payment</h2><p id="pay-note" class="mt-1 text-xs text-neutral-500"></p>
      <form id="pay-form" class="mt-4 space-y-3"><input id="pay-date-input" type="date" required class="w-full rounded border border-neutral-300 px-3 py-2 text-sm"><div class="flex justify-end gap-2"><button type="button" data-close="pay-modal" class="rounded border border-neutral-300 px-3 py-1.5 text-sm">Cancel</button><button class="rounded bg-neutral-900 px-3 py-1.5 text-sm text-white">Confirm Paid</button></div></form>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
